[project]
name = "tender-ai-backend"
version = "0.1.0"
description = "Tender AI 後端：標案 Corpus + 行為/RAG 學習迴圈（FastAPI + Postgres/pgvector）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pgvector>=0.4.2",
    "requests>=2.32",
    "jieba>=0.42.1",
    "pypdf>=4.2",  # PDF 投標須知純文字抽取（純 Python、本機、不外送 LLM）
    "mcp[cli]>=1.2",  # DB 大腦對外 MCP 介面（stdio；見 app/mcp_server.py、MCP_BRIDGE.md）
    "cryptography<49",  # 經 mcp→pyjwt[crypto] 引入；鎖在有預編 wheel 的 48.x，避免 uv sync 觸發 Rust 源碼編譯失敗
]

# 選用相依：瀏覽器抓取（PCC 詳情過 CAPTCHA 用）。CI/測試「不需」安裝——
# scrape_detail_playwright / scrape_detail_cdp 皆 lazy import playwright，測試走 monkeypatch 假 page。
# 本機啟用：`uv sync --extra browser` 後 `uv run playwright install chromium`。
[project.optional-dependencies]
browser = [
    "playwright>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

# 應用型專案（非可發佈套件）：只管相依，不建置 root 套件本身。
# 從專案根目錄以 `uv run` 執行時，cwd 在 sys.path，故 `import app...` 可用。
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  # 讓 `import app...` 在 pytest 下可用（專案根在 sys.path）
filterwarnings = ["ignore::DeprecationWarning"]
