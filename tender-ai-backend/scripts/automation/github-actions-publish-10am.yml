# =============================================================================
# 給 aiadminhq/tender-reports repo 用：把每日發布時間從 08:00 改為 10:00（台灣時間）
# -----------------------------------------------------------------------------
# 台灣為 UTC+8，故 10:00 TW = 02:00 UTC → cron: "0 2 * * *"
#
# 用法：開啟該 repo 內既有的發布 workflow（.github/workflows/*.yml），
#       把其中的 on.schedule.cron 換成下方數值即可；其餘 job 步驟不動。
#       （依專案治理規範，外部 repo 的變更請由本人於該 repo 自行提交，
#         本專案不主動對外 repo 開 PR。）
# =============================================================================

on:
  schedule:
    - cron: "0 2 * * *"      # 10:00 Asia/Taipei（原為 0 0 * * * = 08:00）
  workflow_dispatch:          # 保留手動觸發

# --- 選配：發布完成後，通知本機管線可開始消費 ----------------------------------
# GitHub Actions（雲端）無法直接連到你本機的 PostgreSQL / Ollama / 內網，
# 因此「抓 PCC 詳情建檔 + 灌 Layer C 向量」這段仍由本機 launchd（10:15）執行。
# 若日後本機改用 self-hosted runner，可改用 repository_dispatch 由 Actions 觸發本機 job。
